<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <div class="main-header">
            <h1>DO . IT!</h1>
        </div>
    </header>

    <main class="container">
        <!-- Left Panel: Todo List (main content) -->
        <section class="left-panel">
            <div class="panel-header">
                <h2>My Tasks</h2>
                <span class="badge-count" id="task-count">0</span>
            </div>

            <!-- Todo items are rendered here by app.js -->
            <div id="todo-container"></div>

            <!-- Opens the editor panel on the right in "new task" mode -->
            <button type="button" class="add-task" id="btn-add-task">
                <span class="plus">+</span>
                <span>Add New Task</span>
            </button>
        </section>

        <!-- Right Panel: Task Details (secondary/complementary content) -->
        <aside class="right-panel">
            <!-- Empty state, shown when no task is selected -->
            <div class="empty-state" id="empty-state">
                <h2>Task Details</h2>
                <p>Select a task, or hit "Add New Task", to see it here.</p>
            </div>

            <!-- Detail / add-task editor, filled in dynamically by app.js -->
            <div id="editor-content" class="editor-content" style="display:none;">
                <div class="editor-header">
                    <h2 id="editor-header-title">Task Details</h2>
                    <a href="#" class="btn-close" id="btn-close">&times;</a>
                </div>

                <form class="editor-body" id="editor-form">
                    <div class="editor-field">
                        <label for="editor-name">Task Name</label>
                        <input type="text" id="editor-name" name="editor-name" placeholder="e.g. Tugas Pemrograman Web" required>
                    </div>

                    <div class="editor-field">
                        <label for="editor-description">Description</label>
                        <textarea id="editor-description" name="editor-description" rows="3" placeholder="Add a description..."></textarea>
                    </div>

                    <div class="editor-meta">
                        <label for="due-date">Due Date</label>
                        <input type="date" id="due-date" name="due-date" required>

                        <label for="urgency">Urgency</label>
                        <select id="urgency" name="urgency">
                            <option value="urgent">Urgent</option>
                            <option value="important">Important</option>
                            <option value="normal">Normal</option>
                        </select>
                    </div>

                    <div class="editor-actions">
                        <button type="button" class="btn-delete" id="btn-delete">Delete Task</button>
                        <button type="submit" class="btn-save" id="btn-save">Save Changes</button>
                    </div>
                </form>
            </div>
        </aside>
    </main>

    <footer>
        <p>&copy; 2026 DO . IT! - 5025251254</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
