<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <div class="main-header">
            <h1>DO . IT!</h1>

            <!-- dark mode button -->
            <div class="dark-mode-toggle">
                <label class="switch">
                    <input type="checkbox" id="dark-mode-switch" aria-label="Dark mode">
                    <span class="slider"></span>
                </label>
            </div>
        </div>
    </header>

    <main class="container">
        <!-- Left Panel: Todo List (main content) -->
        <section class="left-panel" aria-label="My tasks">
            <div class="panel-header">
                <h2>My Tasks</h2>
                <span class="badge-count" id="task-count">0</span>

                <!-- Filter: All / Ongoing / Done -->
                <div class="task-filter" id="task-filter" role="group" aria-label="Filter tasks">
                    <button type="button" class="filter-btn" data-filter="all" aria-pressed="true">All</button>
                    <button type="button" class="filter-btn" data-filter="ongoing" aria-pressed="false">Ongoing</button>
                    <button type="button" class="filter-btn" data-filter="done" aria-pressed="false">Done</button>
                </div>
            </div>

            <!-- Todo items -->
            <div id="todo-container"></div>

            <!-- Add Task Button -->
            <button type="button" class="add-task" id="btn-add-task">
                <span class="plus" aria-hidden="true">+</span>
                <span>Add New Task</span>
            </button>
        </section>

        <!-- Right Panel: Task Details -->
        <aside class="right-panel" aria-label="Task details">
            <!-- Empty state -->
            <div class="empty-state" id="empty-state">
                <h2>Task Details</h2>
                <p>Select a task, or hit "Add New Task", to see it here.</p>
            </div>

            <!-- Detail / add-task editor-->
            <div id="editor-content" class="editor-content" style="display:none;">
                <div class="editor-header">
                    <h2 id="editor-header-title">Task Details</h2>
                    <button type="button" class="btn-close" id="btn-close" aria-label="Close task details">&times;</button>
                </div>

                <form class="editor-body" id="editor-form">
                    <div class="editor-field">
                        <label for="editor-name">Task Name</label>
                        <input type="text" id="editor-name" name="editor-name" placeholder="e.g. Tugas Pemrograman Web" required>
                    </div>

                    <div class="editor-field">
                        <label for="editor-description">Description</label>
                        <textarea id="editor-description" name="editor-description" rows="3" placeholder="Add a description..."></textarea>
                    </div>

                    <div class="editor-meta">
                        <label for="due-date">Due Date</label>
                        <input type="date" id="due-date" name="due-date" required>

                        <label for="urgency">Urgency</label>
                        <select id="urgency" name="urgency">
                            <option value="urgent">Urgent</option>
                            <option value="important">Important</option>
                            <option value="normal">Normal</option>
                        </select>

                        <label for="notify-at">Notification Time (optional)</label>
                        <input type="datetime-local" id="notify-at" name="notify-at">
                    </div>

                    <!-- Image field (Media Capture) -->
                    <div class="editor-field" role="group" aria-labelledby="image-label">
                        <span class="field-label" id="image-label">Add Image</span>

                        <img id="image-preview" alt="" hidden>
                        <video id="camera-video" autoplay playsinline muted hidden aria-label="Camera preview"></video>

                        <div class="btn-row">
                            <button type="button" id="btn-camera" aria-label="Take photo" title="Take photo">
                                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                                    <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
                                    <circle cx="12" cy="13" r="4"/>
                                </svg>
                            </button>

                            <button type="button" id="btn-capture" aria-label="Capture photo" title="Capture photo" hidden>
                                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                                    <circle cx="12" cy="12" r="10"/>
                                    <circle cx="12" cy="12" r="4"/>
                                </svg>
                            </button>

                            <button type="button" id="btn-upload" aria-label="Add image file" title="Add image file">
                                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                                    <polyline points="14 2 14 8 20 8"/>
                                    <line x1="12" y1="18" x2="12" y2="12"/>
                                    <line x1="9" y1="15" x2="15" y2="15"/>
                                </svg>
                            </button>

                            <button type="button" id="btn-remove-image" aria-label="Remove image" title="Remove image" hidden>
                                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                                    <polyline points="3 6 5 6 21 6"/>
                                    <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
                                    <path d="M10 11v6M14 11v6"/>
                                    <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>
                                </svg>
                            </button>
                        </div>

                        <input type="file" id="image-file" accept="image/*" hidden>
                        <p class="hint" id="image-status" role="status" aria-live="polite"></p>
                    </div>

                    <div class="editor-actions">
                        <button type="button" class="btn-delete" id="btn-delete">Delete Task</button>
                        <button type="submit" class="btn-save" id="btn-save">Save Changes</button>
                    </div>
                </form>
            </div>
        </aside>
    </main>

    <footer>
        <p>&copy; 2026 DO . IT! - 5025251254</p>
    </footer>

    <!-- Notifikasi UI (toast) -->
    <div id="toast-region" class="toast-region" role="status" aria-live="polite" aria-label="Notifications"></div>

    <!-- Pengumuman untuk screen reader -->
    <div id="announcer" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>

    <script src="script.js"></script>
</body>
</html>
