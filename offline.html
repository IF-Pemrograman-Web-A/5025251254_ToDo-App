<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline · DO . IT!</title>
    <meta name="theme-color" content="#d4f24a">
    <script>try { document.documentElement.setAttribute('data-theme', localStorage.getItem('do-it-theme') || 'light'); } catch (e) {}</script>
    <style>
        :root { --bg: #fdf9e8; --surface: #ffffff; --text: #111111; --line: #111111; --lime: #d4f24a; --pink: #ff5ca8; }
        :root[data-theme="dark"] { --bg: #15151a; --surface: #22222b; --text: #f4f4f5; --line: #f4f4f5; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh; display: grid; place-items: center; padding: 24px;
            background: var(--bg); color: var(--text);
            font-family: 'Poppins', Arial, Helvetica, sans-serif;
        }
        .card {
            max-width: 420px; padding: 28px; text-align: center;
            background: var(--surface); border: 3px solid var(--line);
            border-radius: 14px; box-shadow: 6px 6px 0 var(--line);
        }
        .emoji { font-size: 48px; }
        h1 { margin: 8px 0; font-size: 28px; font-weight: 800; }
        p { margin-bottom: 20px; line-height: 1.5; }
        .actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
        .btn {
            display: inline-flex; align-items: center; min-height: 44px; padding: 8px 16px;
            border: 2px solid var(--line); border-radius: 7px; box-shadow: 3px 3px 0 var(--line);
            font: inherit; font-weight: 600; text-decoration: none; color: #111111; cursor: pointer;
        }
        .btn-primary { background: var(--lime); }
        .btn-secondary { background: var(--pink); }
        :focus-visible { outline: 3px solid #0057d9; outline-offset: 2px; }
    </style>
</head>
<body>
    <main class="card">
        <div class="emoji" aria-hidden="true">📡</div>
        <h1>You're offline</h1>
        <p>No connection right now. Pages you've opened before are still available, but adding or editing tasks needs the internet.</p>
        <div class="actions">
            <button type="button" class="btn btn-primary" id="retry">Try again</button>
            <a class="btn btn-secondary" href="index.php">Open saved tasks</a>
        </div>
    </main>
    <script>
        document.getElementById('retry').addEventListener('click', () => location.reload());
        window.addEventListener('online', () => location.reload());
    </script>
</body>
</html>
